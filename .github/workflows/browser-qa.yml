name: Browser visual QA
on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/**"
      - "tests/**"
      - "playwright.config.mjs"
      - ".github/workflows/browser-qa.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-audit --no-fund --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static website
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kabin-server.log 2>&1 &
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8765/
      - name: Run browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:8765/
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabin-browser-qa-evidence
          path: test-results/
          retention-days: 7
